spring.application.name=Loc-MNS

springdoc.swagger-ui.tags-sorter=alpha

spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto = ${DDL_AUTO}

spring.sql.init.platform = ${SQL_FILE}
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode = ${SQL_INIT_MODE}
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET}

server.servlet.context-path=/api
server.forward-headers-strategy=framework