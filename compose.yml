services:
  postgres:
    image: postgres:18
    container_name: loc-mns-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: UTC
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql


  backend:
    container_name: loc-mns-backend
    build: .
    depends_on:
      - postgres
    image: ${DOCKER_USERNAME}/loc-mns-back:latest
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - DB_HOST=postgres


  frontend:
    container_name: loc-mns-frontend
    image: ${DOCKER_USERNAME}/loc-mns-front:latest
    restart: always

  nginx-proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nginx-proxy-manager
    restart: always
    ports:
      - '80:80'
      - '443:443'
      - '81:81'
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt

volumes:
  postgres_data:
  npm_data:
  npm_letsencrypt:
