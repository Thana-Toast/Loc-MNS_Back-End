services:
  postgres:
    image: postgres:18
    container_name: loc-mns-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - default

  backend:
    container_name: loc-mns-backend
    build: .
    depends_on:
      - postgres
    image: ${DOCKER_USERNAME}/loc-mns-back:latest
    restart: always
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
    volumes:
      - ./uploads:/app/uploads
    networks:
      - default

  frontend:
    container_name: loc-mns-frontend
    image: ${DOCKER_USERNAME}/loc-mns-front:latest
    restart: always
    networks:
      - default
      - proxy-network

networks:
  default:
  proxy-network:
    external: true

volumes:
  postgres_data: