name: Java CI/CD Pipeline

on:
  push:
    branches: "**"

jobs:
  build-test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Update DB_HOST in application.properties
        run: sed -i 's/ ${DB_HOST} /postgres/' src/main/resources/application.properties

      # Cette étape et toutes les précédentes se lancent TOUJOURS (sur toutes les branches)
      - name: Build and Run unit tests with Maven
        run: |
          chmod +x mvnw
          ./mvnw clean package

      # --- LES ÉTAPES CI-DESSOUS NE SE LANCENT QUE SUR LA BRANCHE MAIN ---

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        if: github.ref == 'refs/heads/main'
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ variables.PROJECT_NAME }} .

      - name: Push Docker image
        if: github.ref == 'refs/heads/main'
        run: docker push ${{ secrets.DOCKER_USERNAME }}/${{ variables.PROJECT_NAME }}

      - name: Extract version from pom.xml
        if: github.ref == 'refs/heads/main'
        id: extract_version
        run: echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV

      - name: Tag image with version
        if: github.ref == 'refs/heads/main'
        run: docker tag ${{ secrets.DOCKER_USERNAME }}/${{ variables.PROJECT_NAME }} ${{ secrets.DOCKER_USERNAME }}/${{ variables.PROJECT_NAME }}:${{ env.VERSION }}

      - name: Push tag to Docker Hub
        if: github.ref == 'refs/heads/main'
        run: docker push ${{ secrets.DOCKER_USERNAME }}/${{ variables.PROJECT_NAME }}:${{ env.VERSION }}