name: Java CI/CD Pipeline

on:
  push:
    branches: "**"

jobs:
  build-test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Update DB_HOST in application.properties
        run: sed -i 's/ ${DB_HOST} /postgres/' src/main/resources/application.properties

      # Cette étape et toutes les précédentes se lancent TOUJOURS (sur toutes les branches)
      - name: Build and Run unit tests with Maven
        run: |
          chmod +x mvnw
          ./mvnw clean package

      # --- LES ÉTAPES CI-DESSOUS NE SE LANCENT QUE SUR LA BRANCHE MAIN ---

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        if: github.ref == 'refs/heads/main'
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ vars.PROJECT_NAME }} .

      - name: Push Docker image
        if: github.ref == 'refs/heads/main'
        run: docker push ${{ secrets.DOCKER_USERNAME }}/${{ vars.PROJECT_NAME }}

      - name: Extract version from pom.xml
        if: github.ref == 'refs/heads/main'
        id: extract_version
        run: echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV

      - name: Tag image with version
        if: github.ref == 'refs/heads/main'
        run: docker tag ${{ secrets.DOCKER_USERNAME }}/${{ vars.PROJECT_NAME }} ${{ secrets.DOCKER_USERNAME }}/${{ vars.PROJECT_NAME }}:${{ env.VERSION }}

      - name: Push tag to Docker Hub
        if: github.ref == 'refs/heads/main'
        run: docker push ${{ secrets.DOCKER_USERNAME }}/${{ vars.PROJECT_NAME }}:${{ env.VERSION }}

      - name: Copy Docker Compose
        if: github.ref == 'refs/heads/main'
        uses: garygrossgarten/github-action-scp@release
        with:
          local: compose.yml
          remote: /opt/loc-mns/compose.yml
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          privateKey: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}

      - name: Deploy on server
        if: github.ref == 'refs/heads/main'
        uses: garygrossgarten/github-action-ssh@release
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          privateKey: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          command: |
            echo ${{ secrets.DOCKER_PASSWORD }} | docker login --username ${{ secrets.DOCKER_USERNAME }} --password-stdin
            cd /opt/loc-mns
            docker compose pull
            docker compose up -d
            docker image prune -f